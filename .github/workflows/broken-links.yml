name: Check for broken links

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!lighthouse_results/**"

permissions:
  contents: read

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@f81112d0d2814ded911bd23e3beaa9dda9093915 # v2.1.0
        with:
          fail: true
          # excluded specific external URLs that return 415/timeout for HEAD requests but are reachable
          # use `--exclude` (supported by this lychee version) to ignore links that cause false positives
          args: --user-agent 'curl/7.54' --max-retries 3 --timeout 30 --exclude 'https://www.oprs.it/evento/psicologia-in-cantiere/' --exclude 'https://clinical-neuropsychology.de/steffen-moritz/' --exclude 'https://samothrace.eu/' --exclude-path README.md --exclude-path _pages/404.md --exclude-path _pages/cv.html --exclude-path _pages/resume.html --exclude-path _pages/blog.md --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md --verbose --no-progress './**/*.md' './**/*.html'
