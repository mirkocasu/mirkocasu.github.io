  - role: Visiting Doctoral Researcher
    org: <a href="https://www.epfl.ch/labs/mints/">MINTS Lab</a>, EPFL
    place: Lausanne, Switzerland
    dates: Oct 2025 – Mar 2026
    host: Host Prof. Andrea Cavallaro
    bullets:
      - Ran a controlled comparison of <strong>diffusion and autoregressive LLMs as automated judges</strong>, characterising their evaluation biases; submitted to EACL 2027
      - Analysed conversational trajectories between people and AI assistants
  - role: PhD Researcher
    org: <a href="https://iplab.dmi.unict.it/">IPLab</a>, University of Catania
    place: Catania, Italy
    dates: Aug 2023 – Jul 2026
    host: <a href="https://samothrace.eu/">SAMOTHRACE</a> project · AI for wearables and cognitive bias in forensics
    bullets:
      - Built <strong>ORION</strong>, an end-to-end pipeline that detects smoking episodes from wrist motion sensors by fusing 7 classifiers; on 40 participants (leave-one-subject-out) it reached an event-level F1 of 0.966 with no false positives in 29.5 hours of recordings (under review)
      - Introduced the <strong>impostor bias</strong>, a systematic doubt that real media are authentic, and validated it with 746 participants whose accuracy at spotting AI images sat at chance (47–55.5%)
      - Co-built two forensic benchmarks, <strong>WILD</strong> (20,000 images, 20 generators) and <strong>SynthForensics</strong> (6,815 videos, 5 text-to-video models; NeurIPS 2026), on which state-of-the-art detectors lose 29 AUC points on average
      - Co-developed an <strong>on-device autism screening</strong> pipeline from children's gaze, distilled into a 1.6M-parameter ONNX ensemble that runs offline in an open-source Android app
      - Led scoping reviews on AI chatbots for mental health (300+ citations, cited in UK Parliament POSTnote 737), wearables for smoking detection (49 studies, <em>IEEE JBHI</em>) and AI for eating disorders (7,545 records ranked by an LLM)
  - role: Early professional experience
    place: Catania, Italy
    dates: 2021 – 2023
    bullets:
      - Specialist assistant for pupils with disabilities (I Girasoli cooperative); clinical trainee in applied psychoanalysis (APA Catania); videomaker for the University of Catania, ECLAT and CoEHAR

