# Academic CV: one line of research interests instead of a summary.
interests: >-
  Language models and AI agents and their effects on mental health and human safety;
  bias in human and machine judgement; human perception of synthetic media; AI for clinical psychology.

# Resume: a short profile for readers outside academia.
summary: >-
  AI researcher and licensed clinical psychologist, finishing a PhD in Computer Science at the University of
  Catania. Builds and evaluates AI systems that observe, imitate or judge human behaviour: bias in LLM judges,
  synthetic-media forensics (NeurIPS 2026), and wearable and conversational AI for mental health. Currently AI
  research consultant at Eternal Tech; visiting researcher at EPFL in 2025–26; first-author work referenced by
  INTERPOL and the UK Parliament.

